name: Release Doctor
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
  workflow_dispatch:

jobs:
  release_doctor:
    name: release doctor
    runs-on: ubuntu-latest
    if: github.repository == 'context-dot-dev/context-typescript-sdk' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please') || github.head_ref == 'next')

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify release title matches package version
        if: startsWith(github.head_ref, 'release-please')
        env:
          RELEASE_TITLE: ${{ github.event.pull_request.title }}
        run: |
          test "$RELEASE_TITLE" = "release: $(node -p 'require("./package.json").version')"

      - name: Check release environment
        run: |
          bash ./bin/check-release-environment
