# This workflow is triggered when a GitHub release is created.
# It can also be run manually to re-publish to NPM in case it failed for some reason.
# You can run this workflow by navigating to https://www.github.com/context-dot-dev/context-typescript-sdk/actions/workflows/publish-npm.yml
name: Publish NPM
on:
  workflow_dispatch:
    inputs:
      path:
        description: "The package path to publish ('.' for the SDK)"
        required: true

  release:
    types: [published]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          yarn install

      - name: Build package
        run: |
          if [ -n "$INPUT_PATH" ] && [ "$INPUT_PATH" != "." ]; then
            echo "Only the root SDK package (.) is supported."
            exit 1
          fi
          yarn build
        env:
          INPUT_PATH: ${{ github.event.inputs.path }}

      - name: Publish to NPM
        working-directory: dist
        run: npm publish --access public
